[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-intake-brief"
version = "0.1.0"
description = "Offline intake brief skeleton for LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "pydantic>=2,<3",
  "requests>=2,<3",
  "streamlit>=1.66.1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
